[project]
name = "stocklab"
version = "2.0.0"
description = "Adaptive Dual-Phase PSO-GWO stock forecasting benchmark platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "yfinance>=0.2.40",
    "redis>=5.0",
    "torch>=2.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
serve = ["waitress>=3.0"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["stocklab*"]
